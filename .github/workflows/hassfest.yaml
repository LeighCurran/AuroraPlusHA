name: Validate with hassfest

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      # Every push on those branches
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: home-assistant/actions/hassfest@master
