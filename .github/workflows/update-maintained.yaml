name: Update maintenance badge

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write
  pull-requests: write

env:
  LOOKBACK: 35 days

jobs:
  update-badge:
    name: Update maintenance badge
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMITS=$(git log --since=$(date +%Y-%m-%d -d "-${LOOKBACK}") --oneline)
          if [ -z "${COMMITS}" ]; then
            echo "No recent changes" >&2
            exit 0
          fi
          YEAR="$(date +%Y)"
          sed -i "/Maintenance/s/[0-9]\{3,4\}.svg/${YEAR}.svg/" README.md
          if ! git status --porcelain | grep -q README.md; then
            echo "Badge already correct" >&2
            exit 0
          fi
          git config user.name "maintenance-update-bot"
          git config user.email "shtrom@users.noreply.github.com"
          git checkout -b update-maintenance-${YEAR}
          git add README.md
          git commit -m "update maintenance badge for ${YEAR}"
          git push --force origin HEAD
          EXISTING_PR="$(gh pr list --head "${REFRESH_BRANCH}" --state open \
            --json number --jq '.[].number')"
          if [ -z "${EXISTING_PR}" ]; then
            gh pr create --fill
          fi
